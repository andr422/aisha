<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Кабинет супервизора — ЧекЛист+</title>
<!-- Настоящий кабинет, а не показ: данные читаются ТОЛЬКО ПО ВХОДУ, и
     сервер решает, кого пускать: супервизор и владелец да, терапист нет. Отсюда же
     ставятся решения по целям: «освоено» и «в архив» — планшеты их
     забирают, и архивные цели уходят у тераписта со «Сбора». -->
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="cabinet.css" />
<style>
  .goal-proto { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  .back { background: none; border: none; color: var(--accent); font: inherit; cursor: pointer; padding: 0; margin-bottom: 10px; }
  .two { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .goal-line td:first-child { font-weight: 600; cursor: pointer; min-width: 140px; overflow-wrap: anywhere; }
  .goal-line:hover td:first-child { color: var(--accent); }
  .caret { display: inline-block; width: 12px; color: var(--muted); transition: transform .15s; }
  .goal-line.open .caret { transform: rotate(90deg); }
  .detail td { background: var(--bg); padding: 16px 18px; }
  .detail h4 { font-family: var(--font-display); font-size: 15px; margin: 0 0 8px; }
  .detail table { background: var(--card); border-radius: var(--radius-sm); overflow: hidden; }
  .cells { display: inline-flex; gap: 3px; }
  .cell { width: 14px; height: 14px; border-radius: 3px; background: var(--soft); border: 1px solid var(--line); }
  .cell.on { background: var(--mastered); border-color: var(--mastered); }
  .cond { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--gen-done); color: var(--gen-done-ink); margin: 0 2px 3px 0; white-space: nowrap; }
  .verdict { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.55; }
  .verdict .flag { margin-right: 6px; }
  .switch-modes { display: flex; gap: 8px; margin-bottom: 12px; }
  .switch-modes .btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .leg { display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 13px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  .leg.off { opacity: .45; text-decoration: line-through; }
  .leg-dot { width: 10px; height: 10px; border-radius: 50%; }
  .jump { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 18px; }
  .jump a, .jump button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; background: var(--soft); color: var(--soft-ink); text-decoration: none; border: none; cursor: pointer; }
  .jump a:hover, .jump button:hover { background: var(--accent-soft); color: var(--accent); }
  .jump a.report-link { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  /* Выгрузка — действие для всей карточки, а не переход по разделу: у неё
     свой вид, и в строке она стоит последней, отдельно от ссылок. */
  .jump .download { margin-left: auto; }
  .download {
    font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap;
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--card); color: var(--accent);
  }
  .download:hover { background: var(--accent); color: var(--accent-ink); }
  .download[disabled] { opacity: .6; cursor: default; }
  .bar .download { align-self: flex-start; }
  .proto-block { border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 8px; overflow: hidden; }
  /* Сетка, а не flex с переносом: правый столбец — «Освоен» и «⋮», и он
     стоит на одном месте у всех протоколов. С flex-wrap кнопки у длинных
     названий уезжали на вторую строку влево, и глаз искал их заново в
     каждой карточке. */
  .proto-head { display: grid; grid-template-columns: minmax(0, 1fr) auto;
                align-items: center; column-gap: 12px; padding: 12px 14px; background: var(--card); }
  .proto-left { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; min-width: 0; }
  /* Название занимает строку целиком, если ему тесно: `flex: 1` с нулевой
     основой сжимал его до нуля, длинные слова вылезали за свою клетку и
     наезжали на цифры справа — именно это видно на телефоне. 220px — та
     ширина, ниже которой заголовок читать уже невозможно. */
  .proto-head .title { display: flex; align-items: baseline; gap: 10px; flex: 0 1 auto; min-width: 0; font: inherit; color: inherit; background: none; border: none; text-align: left; cursor: pointer; padding: 0; }
  .proto-head .title:hover b { color: var(--accent); }
  .proto-head.open { background: var(--accent-soft); }
  .proto-head b { font-family: var(--font-display); font-size: 16px; min-width: 0; overflow-wrap: break-word; }
  .proto-head .caret { flex: none; }
  /* Цифры прижаты вправо и растягиваются, кнопки стоят ПОСЛЕ них отдельным
     столбцом. Раньше «Освоен» и «⋮» были хвостом этой строки и у каждого
     протокола оказывались на своём месте — глазу приходилось искать кнопку
     заново в каждой карточке. */
  .proto-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
                justify-content: flex-end; flex: 1 1 auto; min-width: 0; }
  .proto-head > .acts { flex: none; }

  /* Значок «что-то не так» стоит у самого названия и раскрывает подробности:
     что именно, видно по нажатию, а не висит подписью в каждой шапке. */
  .warn-badge {
    flex: none; font: inherit; font-size: 12px; font-weight: 700;
    padding: 3px 9px; border-radius: 999px; cursor: pointer;
    border: 1px solid transparent;
    background: var(--warn-soft); color: var(--warn-ink);
  }
  .warn-badge:hover { border-color: var(--warn); }
  .warn-badge.on { background: var(--warn-ink); color: var(--card); }
  .proto-why { padding: 8px 14px; font-size: 13px; color: var(--warn-ink);
               background: var(--warn-soft); border-top: 1px solid var(--line);
               display: flex; flex-direction: column; gap: 4px; }
  /* Своё `display` перебивает атрибут `hidden` — у браузерного правила
     специфичность ниже, чем у селектора по классу. Без этой строки блок
     виден всегда, сколько ни ставь hidden из скрипта. */
  .proto-why[hidden] { display: none; }
  .why-line b { font-weight: 700; }
  .proto-count { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .proto-body { border-top: 1px solid var(--line); }
  .sess-line td:first-child { cursor: pointer; }
  .sess-line:hover td:first-child { color: var(--accent); }
  /* Обсуждение: не чат, а журнал. Поэтому записи идут сверху вниз по
     времени, без пузырей и без «онлайн» — как заметки в карте. */
  .talk { margin-top: 14px; }
  .talk-item { padding: 10px 0; border-top: 1px solid var(--line); }
  .talk-item:first-child { border-top: none; }
  .talk-who { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .talk-who b { color: var(--text); font-weight: 700; }
  .talk-text { font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .talk-read { font-size: 12px; color: var(--mastered); margin-top: 3px; }
  .talk-unread { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .talk-form { display: flex; gap: 8px; margin-top: 12px; align-items: flex-start; }
  .talk-form textarea {
    flex: 1; min-height: 58px; padding: 9px 11px; font: inherit; font-size: 14px;
    border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
    background: var(--card); color: var(--text); resize: vertical;
  }
  .talk-badge {
    font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); white-space: nowrap;
  }
  @media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } }
  /* Телефон: кнопки уходят на свою строку, а не делят её с названием. В два
     столбца на 375px под заголовок остаётся ~140px, и слова рвутся посреди
     буквы: «Копировани / е линий». Имя протокола важнее — отдаём ему всю
     ширину, кнопки прижимаем к правому краю строкой ниже, чтобы они
     по-прежнему стояли на одном месте у всех протоколов.
     Правило живёт ЗДЕСЬ, а не в cabinet.css: базовое `.proto-head` описано
     несколькими строками выше, специфичность у них одинаковая, и медиа-запрос
     из подключённого раньше файла проигрывает по порядку. */
  @media (max-width: 700px) {
    .proto-head { grid-template-columns: minmax(0, 1fr); row-gap: 8px; }
    .proto-head > .acts { justify-self: end; }
  }
</style>
</head>
<body>
<div id="top"></div>
<div class="wrap" id="wrap">
  <div id="view"><p class="skeleton">Загружаю данные с сервера…</p></div>
  <p class="foot" id="foot"></p>
</div>

<script src="favicon.js"></script>
<script src="auth.js"></script>
<script src="cabinet.js"></script>
<script>
(function () {
  const view = document.getElementById("view");
  const top = document.getElementById("top");
  const wrap = document.getElementById("wrap");
  let state = null;
  let открытыйРебёнок = "";
  // goalDetail рисуется в глубине разметки, а ветке нужен весь ребёнок —
  // держим ссылку рядом, чтобы не тащить его пятым параметром через всё.
  let текущийРебёнок = null;
  let показыватьАрхив = false;
  // Фильтр «только проблемные» — состояние одного просмотра, а не настройка:
  // открыл другого ребёнка — смотришь его целиком, как обычно.
  let толькоПроблемные = false;

  // ── Вход ────────────────────────────────────────────────────────────
  // Кабинет без входа не показывает НИЧЕГО: здесь данные всех детей центра
  // разом, включая тексты эпизодов. Пускает сервер, страница только просит.
  function рисоватьВход(сообщение, плохо) {
    top.innerHTML = "";
    wrap.hidden = true;
    const старый = document.getElementById("gate");
    if (старый) старый.remove();

    const gate = document.createElement("div");
    gate.className = "gate";
    gate.id = "gate";
    gate.innerHTML = `<div class="card">
      <h1>Кабинет супервизора</h1>
      <p>Данные детей центра: цели, занятия, поведение, эпизоды. Открыт супервизорам и владельцу.</p>
      <label for="email">Рабочая почта</label>
      <input type="email" id="email" autocomplete="username" placeholder="и.фамилия@abachecklist.ru" />
      <label for="password">Пароль</label>
      <input type="password" id="password" autocomplete="current-password" />
      <button class="btn primary" type="button" id="enter">Войти</button>
      <p class="msg${плохо ? " bad" : ""}" id="msg">${escapeHtml(сообщение || "")}</p>
    </div>`;
    document.body.append(gate);

    const войти = async () => {
      const msg = document.getElementById("msg");
      const кнопка = document.getElementById("enter");
      msg.className = "msg";
      msg.textContent = "Проверяю…";
      кнопка.disabled = true;
      try {
        await window.abaAuth.login(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        gate.remove();
        wrap.hidden = false;
        старт();
      } catch (err) {
        msg.className = "msg bad";
        msg.textContent = err.message;
      } finally {
        кнопка.disabled = false;
      }
    };
    document.getElementById("enter").addEventListener("click", войти);
    gate.addEventListener("keydown", (e) => { if (e.key === "Enter") войти(); });
  }

  function выходИзКабинета() {
    window.abaAuth.logout();
    рисоватьВход("Вы вышли из кабинета.");
  }

  function старт() {
    view.innerHTML = '<p class="skeleton">Загружаю данные с сервера…</p>';
    loadCabinet().then((data) => {
      state = data;
      top.innerHTML = renderTop(data.me.name, data.me.role);
      document.getElementById("logoutBtn").addEventListener("click", выходИзКабинета);
      if (открытыйРебёнок) renderChild(открытыйРебёнок); else renderList();
      document.getElementById("foot").textContent =
        "Данные приходят с планшетов сами. Обновлено " + humanTime(data.now.toISOString()) + ".";
    }).catch((err) => {
      // Три разных разговора: «войдите», «вошли, но не вам сюда» и «сервер молчит».
      if (err.needAuth) {
        рисоватьВход(err.message === "нужен вход" ? "" : err.message, err.message !== "нужен вход");
        return;
      }
      if (err.forbidden) {
        top.innerHTML = renderTop(window.abaAuth.name() || "", "");
        document.getElementById("logoutBtn").addEventListener("click", выходИзКабинета);
        view.innerHTML = `<div class="err"><b>Кабинет вам не открыт.</b> ${escapeHtml(err.message)}</div>`;
        return;
      }
      view.innerHTML = '<div class="err"><b>Сервер не ответил.</b> ' + escapeHtml(err.message) +
        '. Данные никуда не пропали — они лежат на планшетах и на сервере, недоступна только эта страница.</div>';
    });
  }

  if (window.abaAuth && window.abaAuth.get()) старт(); else рисоватьВход();

  // ── Список детей ────────────────────────────────────────────────────
  // Как расставлять детей в списке. Выбор человека помним: супервизор,
  // которому привычнее алфавит, не должен переключать его каждый вход.
  let порядок = localStorage.getItem("cab_order") === "алфавит" ? "алфавит" : "тревога";

  function renderList() {
    открытыйРебёнок = "";
    показыватьАрхив = false;
    толькоПроблемные = false;
    const t = state.totals || {};
    const silent = state.children.filter((c) => c.days > 0 && c.silentDays >= SILENT_DAYS);
    const stuck = state.children.reduce((n, c) => n + c.stuck, 0);
    const mastered = state.children.reduce((n, c) => n + c.mastered, 0);
    // По умолчанию — по тревоге: заголовок обещает «в первую очередь».
    // Алфавит остаётся под рукой: когда ищешь конкретного ребёнка, порядок
    // «сначала тревожные» только мешает.
    const поТревоге = порядок === "тревога";
    const список = поТревоге
      ? state.children
      : state.children.slice().sort((a, b) => a.label.localeCompare(b.label));

    view.innerHTML = `
      <div class="bar">
        <div>
          <h1>Дети центра</h1>
          <p class="lead" style="margin:0">Всё, что тераписты собрали на планшетах, — здесь, без пересылки файлов и без ручного ввода.</p>
        </div>
        <button type="button" class="download grow" id="dlAll">⬇ Скачать все данные</button>
      </div>
      <div class="tiles">
        <div class="tile"><b>${state.children.length}</b><span>детей в работе</span></div>
        <div class="tile"><b>${t.sessions || 0}</b><span>занятий записано</span></div>
        <div class="tile"><b>${t.measurements || 0}</b><span>замеров по целям</span></div>
        <div class="tile"><b>${mastered}</b><span>целей отвечают критерию</span></div>
        <div class="tile"><b>${silent.length}</b><span>детей без данных ${SILENT_DAYS}+ дней</span></div>
        <div class="tile"><b>${stuck}</b><span>целей стоят на месте</span></div>
      </div>
      <div class="list-head">
        <h2>${поТревоге ? "Кого посмотреть в первую очередь" : "Все дети по алфавиту"}</h2>
        <button type="button" class="linkbtn" id="orderToggle">${
          поТревоге ? "по алфавиту" : "по тревоге"}</button>
      </div>
      <div class="kids">${список.map(kidCard).join("")}</div>`;
    view.querySelectorAll(".kid").forEach((el) => {
      el.addEventListener("click", () => renderChild(el.dataset.label));
    });
    document.getElementById("orderToggle").addEventListener("click", () => {
      порядок = поТревоге ? "алфавит" : "тревога";
      localStorage.setItem("cab_order", порядок);
      renderList();
    });
    document.getElementById("dlAll").addEventListener("click", (e) =>
      выгрузить(e.currentTarget, state.children, "все дети"));
  }

  function kidCard(c) {
    const flags = [];
    if (c.silentDays == null) flags.push('<span class="flag">данных ещё нет</span>');
    else if (c.silentDays >= SILENT_DAYS) flags.push(`<span class="flag alert">нет данных ${c.silentDays} ${plural(c.silentDays, "день", "дня", "дней")}</span>`);
    if (c.stuck) flags.push(`<span class="flag warn">${c.stuck} ${plural(c.stuck, "цель стоит", "цели стоят", "целей стоят")} на месте</span>`);
    if (c.mastered) flags.push(`<span class="flag good">${c.mastered} ${plural(c.mastered, "цель отвечает", "цели отвечают", "целей отвечают")} критерию</span>`);
    if (c.archived.length) flags.push(`<span class="flag">${c.archived.length} в архиве</span>`);
    if (c.talkNew) flags.push(`<span class="flag warn">${c.talkNew} ${plural(c.talkNew, "новый ответ", "новых ответа", "новых ответов")}</span>`);
    // Ребёнок без тераписта не попадёт ни на чей планшет — это видно сразу,
    // а не выясняется по жалобе «не вижу ребёнка».
    if (!c.therapists.length) flags.push('<span class="flag warn">никто не ведёт</span>');
    if (!flags.length) flags.push('<span class="flag good">всё идёт ровно</span>');

    const series = c.active.map((g) => g.last).filter((v) => v != null);
    return `<button class="kid" type="button" data-label="${escapeHtml(c.label)}">
      <div class="kid-top">
        <span class="kid-name">${escapeHtml(c.label)}</span>
        <span class="kid-when">${humanDays(c.silentDays)}</span>
      </div>
      <div class="kid-figures">
        <div><b>${c.active.length}</b>целей в работе</div>
        <div><b>${c.sessions}</b>занятий</div>
        <div><b>${c.avg14 == null ? "—" : c.avg14 + "%"}</b>среднее за 2 недели</div>
        <div style="margin-left:auto">${sparkline(series.slice(-8), 90, 30)}</div>
      </div>
      <div class="flags">${flags.join("")}</div>
    </button>`;
  }

  // ── Карточка ребёнка ────────────────────────────────────────────────
  function renderChild(label) {
    const c = state.children.find((x) => x.label === label);
    if (!c) return renderList();
    закрытьМеню(); // кнопки старого списка сейчас исчезнут
    открытыйРебёнок = label;
    текущийРебёнок = c;
    const вАрхиве = c.archived.length;

    view.innerHTML = `
      <button class="back" type="button">‹ ко всем детям</button>
      <h1>${escapeHtml(c.label)}</h1>
      <p class="lead">Последнее занятие ${humanDays(c.silentDays)}${c.lastDate ? " (" + humanDate(c.lastDate) + ")" : ""} · всего занятий: ${c.sessions}</p>
      <p class="lead" id="whoLine">${ктоВедёт(c)}</p>
      <div class="jump">
        <a class="report-link" href="report.html?child=${encodeURIComponent(c.label)}" target="_blank" rel="noopener">📄 Отчёт для родителей</a>
        ${естьНаЭтомУстройстве(c.label)
          ? `<a href="summary_fixed_aisha.html?child=${encodeURIComponent(c.label)}&open=collect">📱 Открыть «Сбор»</a>`
          : ""}
        <button type="button" id="archiveBtn">${показыватьАрхив ? "‹ к целям в работе" : `📦 Архив${вАрхиве ? ` (${вАрхиве})` : ""}`}</button>
        ${c.talkNew ? `<button type="button" id="talkNewBtn">💬 ${c.talkNew} ${plural(c.talkNew, "новый ответ", "новых ответа", "новых ответов")}</button>` : ""}
        <a href="#goals">Протоколы и цели (${c.active.length})</a>
        <a href="#history">История занятий</a>
        <a href="#gen">Обобщение${c.gen.length ? ` (${c.gen.length})` : ""}</a>
        <a href="#behavior">Поведение</a>
        <a href="#abc">Эпизоды ABC (${c.abc.length})</a>
        <button type="button" class="download" id="dlChild">⬇ Скачать все данные</button>
      </div>

      <div class="two">
        <div>
          <div class="card" id="goals">
            <div class="list-head" style="margin-top:0">
              <h2 style="margin:0">${показыватьАрхив ? "Архив" : "Протоколы и цели"}</h2>
              ${показыватьАрхив || !проблемныеЦели(c).length ? "" : `
                <button type="button" class="linkbtn" id="onlyBad">${толькоПроблемные
                  ? "показать все"
                  : `только проблемные (${проблемныеЦели(c).length})`}</button>`}
            </div>
            ${показыватьАрхив ? archiveBlocks(c) : protocolBlocks(c)}
            <p class="muted" style="margin:12px 0 0;font-size:13px">${показыватьАрхив
              ? "Здесь то, что вы убрали из работы. «Вернуть в работу» возвращает цель и на планшет тераписта."
              : "Протокол раскрывается в список целей, цель — в свою историю. «Освоен» уводит цель в «Генерализацию» у тераписта и оставляет её здесь с ярлыком; «В архив» и «Удалить» — под кнопкой «⋮». Пометка «нет на планшете» означает, что цель удалили в «Настройке»: замеры сохранились, поэтому она видна здесь."}</p>
          </div>

          <div class="card" id="history">
            <h2 style="margin-top:0">История занятий</h2>
            <div class="scroll"><table>
              <thead><tr><th>Дата</th><th>Кто вёл</th><th class="num">Целей отработано</th><th class="num">Средний процент</th><th>Что записано</th></tr></thead>
              <tbody>${sessionRows(c)}</tbody>
            </table></div>
          </div>
        </div>

        <div>
          <div class="card">
            <h2 style="margin-top:0">Общие сведения</h2>
            ${adviceHtml(c)}
          </div>

          <div class="card" style="margin-top:14px">
            <h2 style="margin-top:0">Обсуждение</h2>
            <p class="muted" style="margin:-4px 0 10px;font-size:13px">О ребёнке в целом. Разговор о конкретной цели ведите в самой цели — там он и останется рядом с её графиком.</p>
            ${веткаHtml(c, "", "Записей пока нет.")}
          </div>
        </div>
      </div>

      <div class="card" id="gen" style="margin-top:14px">
        <h2 style="margin-top:0">Обобщение</h2>
        <p class="muted" style="margin:-4px 0 14px;font-size:13px">Освоенную цель проверяют в девяти условиях: три материала, три места, три человека. Пока все девять не пройдены, навык считается привязанным к обстановке.</p>
        ${genBlock(c)}
      </div>

      <div class="card" id="behavior" style="margin-top:14px">
        <h2 style="margin-top:0">Поведение: как часто</h2>
        ${behaviorBlock(c)}
      </div>

      <div class="card" id="abc" style="margin-top:14px">
        <h2 style="margin-top:0">Эпизоды ABC</h2>
        <p class="muted" style="margin:-4px 0 14px;font-size:13px">Терапист записывает эпизод сразу после того, как он случился: что было до, что именно произошло и что было после.</p>
        ${abcHtml(c)}
      </div>`;

    view.querySelector(".back").addEventListener("click", renderList);
    document.getElementById("dlChild").addEventListener("click", (e) =>
      выгрузить(e.currentTarget, [c], c.label));
    document.getElementById("whoEdit").addEventListener("click", () => правитьКтоВедёт(c));
    const кнопкаНовых = document.getElementById("talkNewBtn");
    if (кнопкаНовых) кнопкаНовых.addEventListener("click", () => открытьПервоеНовое(c));
    document.getElementById("archiveBtn").addEventListener("click", () => {
      показыватьАрхив = !показыватьАрхив;
      renderChild(label);
    });
    const кнопкаБед = document.getElementById("onlyBad");
    if (кнопкаБед) кнопкаБед.addEventListener("click", () => {
      толькоПроблемные = !толькоПроблемные;
      renderChild(label);
    });

    if (c.behavior.length) {
      const off = new Set();
      let mode = "rate";
      drawBehavior(c, mode, off);
      view.querySelectorAll(".switch-modes .btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          view.querySelectorAll(".switch-modes .btn").forEach((b) => b.classList.remove("on"));
          btn.classList.add("on");
          mode = btn.dataset.mode;
          drawBehavior(c, mode, off);
        });
      });
    }

    view.querySelectorAll(".warn-badge").forEach((значок) => {
      значок.addEventListener("click", () => {
        const строка = view.querySelector(`.proto-why[data-why-body="${значок.dataset.why}"]`);
        if (!строка) return;
        строка.hidden = !строка.hidden;
        значок.setAttribute("aria-expanded", String(!строка.hidden));
        значок.classList.toggle("on", !строка.hidden);
      });
    });

    view.querySelectorAll(".proto-head .title").forEach((head) => {
      head.addEventListener("click", () => {
        const body = view.querySelector(`[data-proto-body="${head.dataset.proto}"]`);
        if (!body) return;
        body.hidden = !body.hidden;
        head.closest(".proto-head").classList.toggle("open", !body.hidden);
        const слот = body.querySelector(".talk-slot");
        if (!body.hidden && слот) наполнитьВетку(c, слот);
      });
    });

    // Цель раскрывается по нажатию на название: сразу вываливать двадцать
    // графиков — каша, а прятать историю совсем — обесценивать главное.
    // Кнопки решений живут в своей ячейке и разворот не трогают.
    view.querySelectorAll(".goal-line td:first-child").forEach((cell) => {
      cell.addEventListener("click", () => {
        const row = cell.closest(".goal-line");
        const detail = view.querySelector(`.detail[data-detail="${row.dataset.goal}"]`);
        if (!detail) return;
        detail.hidden = !detail.hidden;
        row.classList.toggle("open", !detail.hidden);
      });
    });

    view.querySelectorAll(".sess-line td:first-child").forEach((cell) => {
      cell.addEventListener("click", () => {
        const row = cell.closest(".sess-line");
        const detail = view.querySelector(`.sess-detail[data-date="${row.dataset.date}"]`);
        if (!detail) return;
        detail.hidden = !detail.hidden;
        row.classList.toggle("open", !detail.hidden);
      });
    });

    связатьВетки(c);
    // Первый протокол раскрыт по умолчанию — его ветка должна быть на месте
    // сразу, иначе появилась бы только после сворачивания и раскрытия.
    view.querySelectorAll(".proto-body:not([hidden]) .talk-slot").forEach((слот) => наполнитьВетку(c, слот));

    view.querySelectorAll(".act.more").forEach((btn) => {
      btn.addEventListener("click", () => открытьМеню(c.label, btn));
    });

    view.querySelectorAll(".act:not(.more)").forEach((btn) => {
      btn.addEventListener("click", () => {
        закрытьМеню();
        решить(c.label, btn);
      });
    });
  }

  // Есть ли профиль этого ребёнка НА ЭТОМ устройстве. Кабинет и приложение
  // живут на одном сайте, поэтому список профилей планшета читается прямо
  // отсюда. Смысл проверки: на ноутбуке супервизора профилей нет вовсе, и
  // кнопка «Открыть „Сбор“» вела бы в пустое занятие. Появляется она только
  // на планшете, где этот ребёнок действительно заведён.
  function естьНаЭтомУстройстве(label) {
    try {
      const список = JSON.parse(localStorage.getItem("aba_children") || "[]");
      return Array.isArray(список) && список.some((c) => c && c.label === label);
    } catch {
      return false;
    }
  }

  // ── Обсуждения ──────────────────────────────────────────────────────
  // Записи привязаны к цели, к протоколу или к ребёнку целиком. Показываем
  // всю ветку сразу: это журнал, а не переписка, и «свернуть старое» здесь
  // мешало бы — смысл именно в истории.
  // Сравнение обрезанное и без регистра: на планшете название цели может
  // быть с пробелом на конце («Открой »), а приёмник пробелы срезает.
  // Точное сравнение теряло ветку — это уже случилось в бою.
  const какКлюч = (s) => String(s || "").trim().replace(/\s+/g, " ").toLowerCase();

  // Обсуждение привязано к ПРОТОКОЛУ, а не к цели: названий протоколов
  // меньше, они стабильнее, и разговор обычно идёт про направление работы,
  // а не про одну строку. Записи, сделанные раньше по целям, остаются в
  // ветке своего протокола с пометкой, о какой цели речь.
  function записиПо(c, protocol) {
    return c.talk.filter((z) => какКлюч(z.protocol) === какКлюч(protocol));
  }

  function веткаHtml(c, protocol, подпись) {
    const записи = записиПо(c, protocol);
    const ключ = protocol || "";
    return `<div class="talk" data-talk="${escapeHtml(ключ)}">
      ${записи.length
        ? записи.map((z) => `<div class="talk-item">
            <div class="talk-who"><b>${escapeHtml(z.author || "без имени")}</b>${z.role === "therapist" ? ", терапист" : ""} · ${humanDate(day(z.created))}${
              z.goal ? ` · про цель «${escapeHtml(z.goal)}»` : ""}${
              z.unread ? ' <span class="talk-badge">новое</span>' : ""}</div>
            <div class="talk-text">${escapeHtml(z.text)}</div>
            ${z.role === "therapist" ? "" : (z.read && z.read.length
              ? `<div class="talk-read">прочитала ${z.read.map((r) => escapeHtml(r.name) + (r.at ? ", " + humanDate(day(r.at)) : "")).join("; ")}</div>`
              : '<div class="talk-unread">терапист ещё не открывал</div>')}
          </div>`).join("")
        : `<p class="muted" style="margin:0;font-size:13px">${подпись}</p>`}
      <div class="talk-form">
        <textarea placeholder="Написать тераписту…"></textarea>
        <button class="act done" type="button" data-send="${escapeHtml(ключ)}">Отправить</button>
      </div>
    </div>`;
  }

  // Ветка цели рисуется ЛЕНИВО, при раскрытии строки. У ребёнка бывает сорок
  // целей, и держать в разметке сорок полей ввода ради одной открытой —
  // расточительство: страница тяжелеет, а пользы ноль.
  function наполнитьВетку(c, слот) {
    if (слот.dataset.готово === "1") return;
    слот.innerHTML = веткаHtml(c, слот.dataset.protocol,
      "Записей по этому протоколу пока нет. Напишите тераписту — он увидит запись в «Сборе», у этого протокола.");
    слот.dataset.готово = "1";
    связатьВетку(c, слот.querySelector(".talk"));
    // Открыл ветку — значит прочитал. Метку снимаем сразу на экране, чтобы
    // не ждать перезагрузки данных.
    // Пометку «новое» у самих записей НЕ убираем сразу: человек только что
    // открыл ветку, и полезно видеть, что именно было новым. А вот счётчик
    // сверху гасим — он про «есть непрочитанное», и это уже неправда.
    const новые = записиПо(c, слот.dataset.protocol).filter((z) => z.unread);
    if (!новые.length) return;
    новые.forEach((z) => { z.unread = false; });
    markTalkRead(c.label, новые.map((z) => z.id));

    c.talkNew = Math.max(0, (c.talkNew || 0) - новые.length);
    const кнопка = document.getElementById("talkNewBtn");
    if (кнопка) {
      if (!c.talkNew) кнопка.remove();
      else кнопка.textContent = `💬 ${c.talkNew} ${plural(c.talkNew, "новый ответ", "новых ответа", "новых ответов")}`;
    }
  }

  // Переход к первому непрочитанному: раскрывает нужный протокол и цель.
  // Иначе супервизор знает, что «есть новое», но ищет его перебором.
  function открытьПервоеНовое(c) {
    const новое = c.talk.find((z) => z.unread);
    if (!новое) return;
    if (!новое.protocol) {
      document.querySelector(".card .talk").scrollIntoView({ block: "center" });
      return;
    }
    const заголовок = [...view.querySelectorAll("#goals .proto-head .title")]
      .find((b) => b.textContent.trim().indexOf(новое.protocol) >= 0);
    if (заголовок) {
      const тело = view.querySelector(`[data-proto-body="${заголовок.dataset.proto}"]`);
      if (тело && тело.hidden) заголовок.click();
    }
    const тело = заголовок && view.querySelector(`[data-proto-body="${заголовок.dataset.proto}"]`);
    if (тело) { наполнитьВетку(c, тело.querySelector(".talk-slot")); тело.querySelector(".talk-slot").scrollIntoView({ block: "center" }); }
  }

  function связатьВетки(c) {
    view.querySelectorAll(".card > .talk").forEach((блок) => связатьВетку(c, блок));
  }

  function связатьВетку(c, блок) {
    if (!блок) return;
    блок.querySelectorAll("[data-send]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const поле = блок.querySelector("textarea");
        const текст = поле.value.trim();
        if (!текст) { поле.focus(); return; }
        const protocol = блок.dataset.talk;

        btn.disabled = true;
        btn.textContent = "Отправляю…";
        try {
          await sendTalk(c.label, protocol, текст);
          state = await loadCabinet();
          renderChild(c.label);
          сказать("Записано. Терапист увидит при следующем открытии «Сбора».");
        } catch (err) {
          btn.disabled = false;
          btn.textContent = "Отправить";
          сказать("Не отправилось: " + err.message);
        }
      });
    });
  }

  // ── Кто ведёт ребёнка ───────────────────────────────────────────────
  // От привязки зависит, что терапист увидит на своём планшете: список
  // детей, настройку, историю занятий, решения по целям. Поэтому строка
  // стоит на видном месте, а не спрятана в настройках.
  function ктоВедёт(c) {
    const имена = c.therapists.map((s) => escapeHtml(s.name)).join(", ");
    return `Ведут: <b>${имена || "никто не закреплён"}</b> `
      + `<button type="button" class="linkbtn" id="whoEdit">изменить</button>`
      + (c.therapists.length ? "" : ` <span class="muted">— на планшетах этот ребёнок доступен только вам</span>`);
  }

  function правитьКтоВедёт(c) {
    const все = state.staff || [];
    if (!все.length) {
      сказать("Терапистов в списке нет — учётные записи заводятся в админке базы.");
      return;
    }
    const выбраны = new Set(c.therapists.map((s) => s.id));
    const строка = document.getElementById("whoLine");
    строка.innerHTML = `<span class="muted">Кто ведёт «${escapeHtml(c.label)}»:</span> `
      + все.map((s) => `<button type="button" class="part${выбраны.has(s.id) ? " on" : ""}" data-staff="${s.id}">${escapeHtml(s.name)}</button>`).join(" ")
      + ` <button type="button" class="act done" id="whoSave">Сохранить</button>`
      + ` <button type="button" class="act" id="whoCancel">Отмена</button>`;

    строка.querySelectorAll(".part").forEach((b) => {
      b.addEventListener("click", () => {
        const id = b.dataset.staff;
        if (выбраны.has(id)) выбраны.delete(id); else выбраны.add(id);
        b.classList.toggle("on", выбраны.has(id));
      });
    });
    document.getElementById("whoCancel").addEventListener("click", () => renderChild(c.label));
    document.getElementById("whoSave").addEventListener("click", async () => {
      const кнопка = document.getElementById("whoSave");
      кнопка.disabled = true;
      кнопка.textContent = "Сохраняю…";
      try {
        await sendTherapists(c.label, [...выбраны]);
        state = await loadCabinet();
        renderChild(c.label);
        сказать(выбраны.size
          ? "Сохранено. У тераписта ребёнок появится при следующем входе в приложение."
          : "Сохранено: ребёнок больше ни за кем не закреплён.");
      } catch (err) {
        кнопка.disabled = false;
        кнопка.textContent = "Сохранить";
        сказать("Не получилось: " + err.message);
      }
    });
  }

  // ── Решения ─────────────────────────────────────────────────────────
  // Отдельное подтверждение на каждое нажатие было бы навязчивым: решение
  // обратимо в один клик из архива, и об этом сказано рядом. Спрашиваем
  // только про протокол целиком — там за одним нажатием уходит десяток целей.
  async function решить(label, btn) {
    const protocol = btn.dataset.protocol;
    const goal = btn.dataset.goal || "";
    const status = btn.dataset.status;
    const целей = Number(btn.dataset.count || 0);
    // «Снять отметку» и «Вернуть в работу» — одно и то же действие на сервере
    // (решение удаляется), но человеку это разные вещи.
    const сняли = btn.textContent.indexOf("Снять") === 0;

    // Удаление спрашиваем ВСЕГДА, даже по одной цели: это единственное
    // действие, которое стирает настройку на планшете и которое нельзя
    // отменить кнопкой.
    if (status === "deleted") {
      const ok = window.confirm(
        (goal
          ? `Цель «${goal}» — удалить?\n\nОна исчезнет из кабинета`
          : `Протокол «${protocol}» — удалить?\n\n` +
            `Это ${целей} ${plural(целей, "цель", "цели", "целей")}. Протокол и его цели исчезнут из кабинета`) +
        ` и СТИРАЮТСЯ на планшете, в «Настройке». Вернуть кнопкой нельзя — только завести заново.\n\n` +
        `Замеры не удаляются: занятия, проценты и отчёты за прошлые месяцы остаются на месте.`
      );
      if (!ok) return;
    }

    if (!goal && status !== "active" && status !== "deleted" && целей > 1) {
      const ok = window.confirm(
        status === "mastered"
          ? `Протокол «${protocol}»: отметить освоенным?\n\n` +
            `Это ${целей} ${plural(целей, "цель", "цели", "целей")} — у тераписта они перейдут в блок ` +
            `«Генерализация». В кабинете останутся на месте, с ярлыком «освоена». Отметку можно снять.`
          : `Протокол «${protocol}»: убрать в архив?\n\n` +
            `Это ${целей} ${plural(целей, "цель", "цели", "целей")} — они уйдут со «Сбора» у тераписта. ` +
            `Вернуть можно в один клик из архива.`
      );
      if (!ok) return;
    }

    view.querySelectorAll(".act").forEach((b) => { b.disabled = true; });
    try {
      await sendDecision(label, protocol, goal, status);
      state = await loadCabinet();
      // Удаление могло опустошить архив (например, удалили то, что там
      // лежало) — тогда показывать пустой архив незачем.
      const свежий = state.children.find((x) => x.label === label);
      if (показыватьАрхив && свежий && !свежий.archived.length) показыватьАрхив = false;
      renderChild(label);
      сказать(status === "mastered" ? "Отмечено освоенным."
        : status === "archived" ? "Убрано в архив."
        : status === "deleted" ? "Удалено. На планшете исчезнет при следующем выходе в сеть."
        : сняли ? "Отметку сняли." : "Вернули в работу.");
    } catch (err) {
      view.querySelectorAll(".act").forEach((b) => { b.disabled = false; });
      сказать("Не получилось: " + err.message);
    }
  }

  // Выгрузка. Собирается прямо в браузере из уже загруженных данных —
  // второй запрос к серверу не нужен, а значит и ждать нечего, кроме сжатия.
  async function выгрузить(кнопка, дети, подпись) {
    const было = кнопка.textContent;
    кнопка.disabled = true;
    кнопка.textContent = "Собираю…";
    try {
      const размер = await скачатьВыгрузку(дети, state.now, подпись);
      // Говорим, ЧТО именно скачалось: кнопка на списке детей и кнопка в
      // карточке выглядят одинаково, а содержимое у них разное.
      сказать(`Сохранено: ${подпись}, ${Math.max(1, Math.round(размер / 1024))} КБ. Внутри CSV — открываются в Excel.`);
    } catch (err) {
      сказать("Не получилось собрать файл: " + err.message);
    } finally {
      кнопка.disabled = false;
      кнопка.textContent = было;
    }
  }

  function сказать(текст) {
    const старый = document.querySelector(".toast");
    if (старый) старый.remove();
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = текст;
    document.body.append(el);
    setTimeout(() => el.remove(), 3500);
  }

  // ── Протоколы и цели ────────────────────────────────────────────────
  // Порядок меток фиксированный, чтобы шапки протоколов читались одинаково
  // и глаз не искал каждый раз заново.
  const ПОРЯДОК_БЕД = ["низкие замеры", "стоит на месте", "данных мало"];

  // В шапке — ОДИН значок с числом целей, а не три подписи. Когда метки
  // висят на одиннадцати протоколах из четырнадцати, три подписи в каждой
  // шапке перестают быть сигналом и становятся фоном: глазу не за что
  // зацепиться. Что именно не так — написано строкой внутри протокола,
  // там, где супервизор всё равно окажется, когда решит разбираться.
  // Не «низкие замеры: 2», а какие именно цели. Счёт заставляет супервизора
  // открывать протокол и сверять глазами; имена отвечают на вопрос сразу.
  function бедыПоименно(items) {
    const по = new Map();
    items.forEach((g) => (g.проблемы || []).forEach((п) => {
      if (!по.has(п.метка)) по.set(п.метка, []);
      по.get(п.метка).push(g.goal);
    }));
    return ПОРЯДОК_БЕД.filter((м) => по.has(м)).map((м) => ({ метка: м, цели: по.get(м) }));
  }

  function меткаБед(items, pi) {
    const сколько = items.filter((g) => (g.проблемы || []).length).length;
    if (!сколько) return "";
    const подсказка = бедыПоименно(items)
      .map((б) => `${б.метка}: ${б.цели.join(", ")}`).join("\n");
    return `<button class="warn-badge" type="button" data-why="${pi}" aria-expanded="false"
      title="${escapeHtml(подсказка)}">⚠ ${сколько}</button>`;
  }

  // Подробности живут отдельной строкой ПОД шапкой, а не внутри тела:
  // тогда значок работает и у свёрнутого протокола — не надо раскрывать
  // сорок целей, чтобы прочитать «низкие замеры: 2».
  function строкаБед(items, pi) {
    const список = бедыПоименно(items);
    if (!список.length) return "";
    const строки = список.map((б) =>
      `<span class="why-line"><b>${escapeHtml(б.метка)}:</b> ${
        б.цели.map((ц) => `«${escapeHtml(ц)}»`).join(", ")}</span>`).join("");
    return `<div class="proto-why" data-why-body="${pi}" hidden>${строки}</div>`;
  }

  const проблемныеЦели = (c) => c.active.filter((g) => (g.проблемы || []).length);

  function protocolBlocks(c) {
    // Фильтр прячет цели, у которых всё в порядке, и протоколы, где после
    // этого не осталось ничего. Считаем от c.active: разобранное в архиве
    // внимания уже не просит.
    const goals = толькоПроблемные ? проблемныеЦели(c) : c.active;
    if (толькоПроблемные && !goals.length) {
      return `<p class="muted" style="margin:0">Целей с признаками проблем нет: замеры не проваливаются, движение есть, данные собираются.</p>`;
    }
    if (!goals.length) {
      return `<p class="muted" style="margin:0">${c.goals.length
        ? "Все цели этого ребёнка разобраны — смотрите архив."
        : "Замеров пока нет."}</p>`;
    }

    const byProto = new Map();
    goals.forEach((g) => {
      if (!byProto.has(g.protocol)) byProto.set(g.protocol, []);
      byProto.get(g.protocol).push(g);
    });

    return [...byProto.entries()].map(([title, items], pi) => {
      const mastered = items.filter((g) => g.status === "mastered").length;
      const values = items.map((g) => g.last).filter((v) => v != null);
      const avg = values.length ? Math.round(values.reduce((a, b) => a + b, 0) / values.length) : null;
      // При фильтре раскрываем все блоки: иначе супервизор снова щёлкает по
      // протоколам по одному — а фильтр затевался ровно от этого.
      const open = толькоПроблемные || pi === 0;
      const решениеПротокола = c.protocolDecisions.get(title);

      return `<div class="proto-block">
        <div class="proto-head${open ? " open" : ""}">
          <div class="proto-left">
            <button class="title" type="button" data-proto="${pi}">
              <span class="caret">▸</span>
              <b>${escapeHtml(title)}</b>
            </button>
            ${меткаБед(items, pi)}
            <span class="proto-meta">
            ${mastered ? `<span class="flag good">освоено: ${mastered}</span>` : ""}
            ${avg == null ? "" : `<span class="proto-count">среднее <b class="${pctClass(avg)}">${avg}%</b></span>`}
            <span class="proto-count">${items.length} ${plural(items.length, "цель", "цели", "целей")}</span>
            ${(() => { const з = записиПо(c, title);
              const н = з.filter((z) => z.unread).length;
              return з.length ? `<span class="talk-badge">💬 ${з.length}${н ? " · новое" : ""}</span>` : ""; })()}
            ${протоколаНетНаПланшете(c, title, items)}
            ${решениеПротокола && решениеПротокола.status === "mastered"
              ? `<span class="flag good">протокол освоен${решениеПротокола.at ? " · " + humanDate(решениеПротокола.at) : ""}</span>` : ""}
            </span>
          </div>
          <span class="acts">
            ${решениеПротокола && решениеПротокола.status === "mastered"
              ? `<button class="act back" type="button" data-protocol="${escapeHtml(title)}" data-status="active">Снять отметку</button>`
              : `<button class="act done" type="button" data-protocol="${escapeHtml(title)}" data-status="mastered" data-count="${items.length}">Освоен</button>`}
            ${меню({ protocol: title, count: items.length })}
          </span>
        </div>
        ${строкаБед(items, pi)}
        <div class="proto-body" data-proto-body="${pi}"${open ? "" : " hidden"}>
          <div class="scroll"><table>
            <thead><tr><th>Цель</th><th class="num">Сейчас</th><th>Динамика</th><th>Статус</th><th class="num">Замеров</th><th></th></tr></thead>
            <tbody>${items.map((g) => goalRow(c, g)).join("")}</tbody>
          </table></div>
          <div style="padding:12px 14px 14px">
            ${(() => { const з = записиПо(c, title); return `
            <details class="fold"${з.length ? " open" : ""}>
              <summary>Обсуждение протокола${з.length ? ` · ${з.length}` : ""}</summary>
              <div class="talk-slot" data-protocol="${escapeHtml(title)}"></div>
            </details>`; })()}
          </div>
        </div>
      </div>`;
    }).join("");
  }

  function goalRow(c, g) {
    const [cls, text] = STATUS_TEXT[g.status] || ["", g.status];
    const values = g.points.map((p) => p.percent);
    const id = c.goals.indexOf(g);
    // Решение супервизора «освоена» цель из списка не убирает — она остаётся
    // видимой с ярлыком, а на её месте появляется способ решение снять.
    const решено = g.decision && g.decision.status === "mastered";
    const своё = c.goalDecisions.has(g.protocol + " ‖ " + g.goal);
    const подпись = решено && g.decision.by
      ? ` title="${escapeHtml(g.decision.by)}${g.decision.at ? ", " + humanDate(g.decision.at) : ""}"`
      : "";
    return `<tr class="goal-line" data-goal="${id}">
      <td><span class="caret">▸</span> ${escapeHtml(g.goal)}</td>
      <td class="num"><span class="${pctClass(g.last)}">${g.last == null ? "—" : g.last + "%"}</span></td>
      <td>${sparkline(values.slice(-10), 110, 28)}</td>
      <td>${решено
        ? `<span class="flag good"${подпись}>освоена</span>`
        : `<span class="flag ${cls}">${text}</span>`}${нетНаПланшете(c, g)}</td>
      <td class="num">${values.length}</td>
      <td><span class="acts">
        ${решено
          ? (своё
            ? `<button class="act back" type="button" data-protocol="${escapeHtml(g.protocol)}" data-goal="${escapeHtml(g.goal)}" data-status="active">Снять отметку</button>`
            : '<span class="decided">решение по протоколу</span>')
          : `<button class="act done" type="button" data-protocol="${escapeHtml(g.protocol)}" data-goal="${escapeHtml(g.goal)}" data-status="mastered">Освоена</button>`}
        ${меню({ protocol: g.protocol, goal: g.goal })}
      </span></td>
    </tr>
    ${goalDetail(g, id, 6)}`;
  }

  // «Нет на планшете»: цель есть в замерах, но в последнем слепке настройки
  // её нет — значит, на планшете её удалили. Замеры при этом никуда не
  // делись, поэтому цель и остаётся в кабинете. Пометку показываем ТОЛЬКО
  // когда слепок есть: у ребёнка без слепка мы просто не знаем состава
  // планшета, и молчание честнее догадки.
  function нетНаПланшете(c, g) {
    if (g.onDevice !== false) return "";
    const когда = c.snapshot && c.snapshot.at ? ` от ${humanDate(c.snapshot.at)}` : "";
    return ` <span class="flag" title="В настройке планшета${когда} этой цели нет — её удалили на планшете. Замеры сохранились, поэтому цель видна здесь.">нет на планшете</span>`;
  }

  // То же для протокола: помечаем, только если НИ ОДНОЙ его цели на планшете
  // не осталось. Частичное совпадение — обычное дело: цели приходят и уходят.
  function протоколаНетНаПланшете(c, title, items) {
    if (!c.snapshot) return "";
    if (c.snapshot.protocols.has(title)) return "";
    if (!items.every((g) => g.onDevice === false)) return "";
    const когда = c.snapshot.at ? ` от ${humanDate(c.snapshot.at)}` : "";
    return `<span class="flag" title="В настройке планшета${когда} этого протокола нет — его удалили на планшете. Замеры сохранились.">нет на планшете</span>`;
  }

  // Меню «⋮»: редкие и весомые действия. «Освоен» остаётся снаружи — его
  // нажимают чаще всего, а «в архив» и «удалить» на виду соблазняли бы
  // нажать мимоходом.
  function меню({ protocol, goal, count }) {
    return `<button class="act more" type="button" aria-label="Ещё действия"
      data-protocol="${escapeHtml(protocol)}"${goal ? ` data-goal="${escapeHtml(goal)}"` : ""}${count ? ` data-count="${count}"` : ""}>⋮</button>`;
  }

  // Меню висит в body и позиционируется по кнопке, а НЕ лежит рядом с ней в
  // разметке. Причина: строки целей живут в таблице внутри блока с боковой
  // прокруткой, а у карточки протокола `overflow: hidden` — выпадашка
  // внутри них обрезалась по краю блока, и до нижних пунктов было не
  // добраться.
  let открытоеМеню = null;

  function закрытьМеню() {
    if (!открытоеМеню) return;
    открытоеМеню.меню.remove();
    открытоеМеню.кнопка.classList.remove("on");
    открытоеМеню = null;
  }

  function открытьМеню(label, кнопка) {
    const тоЖе = открытоеМеню && открытоеМеню.кнопка === кнопка;
    закрытьМеню();
    if (тоЖе) return; // повторное нажатие закрывает

    const меню = document.createElement("div");
    меню.className = "menu-pop";
    [
      { status: "archived", text: "В архив", cls: "" },
      { status: "deleted", text: "Удалить…", cls: "danger" }
    ].forEach((пункт, i) => {
      if (i) меню.append(document.createElement("hr"));
      const b = document.createElement("button");
      b.type = "button";
      b.className = ("act " + пункт.cls).trim();
      b.textContent = пункт.text;
      // Данные переносим с кнопки «⋮» — дальше всё как у обычной кнопки.
      b.dataset.protocol = кнопка.dataset.protocol;
      if (кнопка.dataset.goal) b.dataset.goal = кнопка.dataset.goal;
      if (кнопка.dataset.count) b.dataset.count = кнопка.dataset.count;
      b.dataset.status = пункт.status;
      b.addEventListener("click", () => {
        закрытьМеню();
        решить(label, b);
      });
      меню.append(b);
    });

    document.body.append(меню);
    кнопка.classList.add("on");
    открытоеМеню = { меню, кнопка };
    поставитьМеню(меню, кнопка);
  }

  // Позиция: под кнопкой, по её правому краю. Не помещается вниз —
  // разворачиваем вверх; упирается в край окна — прижимаем к нему.
  //
  // Координаты СТРАНИЦЫ, а не окна (position: absolute + scrollX/scrollY):
  // тогда меню едет вместе с содержимым само, и ему не нужен обработчик
  // прокрутки. Фиксированное позиционирование требовало бы пересчёта на
  // каждый скролл, а события прокрутки доходят не во всех оболочках.
  function поставитьМеню(меню, кнопка) {
    const r = кнопка.getBoundingClientRect();
    const ш = меню.offsetWidth;
    const в = меню.offsetHeight;
    const вверх = window.innerHeight - r.bottom < в + 12 && r.top > в + 12;
    const верх = вверх ? r.top - в - 6 : r.bottom + 6;
    const лево = Math.max(8, Math.min(r.right - ш, window.innerWidth - ш - 8));
    меню.style.top = (верх + window.scrollY) + "px";
    меню.style.left = (лево + window.scrollX) + "px";
  }

  // Один слушатель на всю страницу: списки перерисовываются часто, и вешать
  // обработчики закрытия на каждую перерисовку — верный способ их накопить.
  document.addEventListener("click", (e) => {
    if (!открытоеМеню) return;
    if (e.target.closest(".menu-pop") || e.target === открытоеМеню.кнопка) return;
    закрытьМеню();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") закрытьМеню(); });

  // Прокрутка меню не касается: оно в потоке страницы и едет вместе с ней.
  // При смене размера окна пересчитываем позицию, а не закрываем: человек
  // менял размер окна, а не передумал выбирать.
  window.addEventListener("resize", () => {
    if (открытоеМеню) поставитьМеню(открытоеМеню.меню, открытоеМеню.кнопка);
  });

  function goalDetail(g, id, colspan) {
    const values = g.points.map((p) => p.percent);
    return `<tr class="detail" data-detail="${id}" hidden><td colspan="${colspan}">
      <h4>Все замеры по этой цели: ${values.length}</h4>
      ${chart(g.points)}
      <div class="scroll" style="margin-top:12px"><table>
        <thead><tr><th>Занятие</th><th class="num">Процент</th><th>Как отвечал</th><th>Подсказки</th></tr></thead>
        <tbody>${g.points.slice().reverse().map((p) => `<tr>
          <td>${humanDate(p.date)}</td>
          <td class="num"><span class="${pctClass(p.percent)}">${p.percent}%</span></td>
          <td>${responsesHtml(p.responses)}</td>
          <td class="muted">${escapeHtml(p.prompts || "—")}</td>
        </tr>`).join("")}</tbody>
      </table></div>
      <p class="muted" style="margin:10px 0 0;font-size:13px">Ничего не удаляется: сохраняется каждая проба каждого занятия — и процент, и последовательность ответов.</p>
    </td></tr>`;
  }

  // ── Архив ───────────────────────────────────────────────────────────
  // Отдельный вид, а не галочка «показать скрытые»: архив открывают редко и
  // с другой целью — вспомнить, что было, или вернуть убранное по ошибке.
  function archiveBlocks(c) {
    const items = c.archived;
    if (!items.length) {
      return '<p class="muted" style="margin:0">Архив пуст: пока ничего не убирали. Отметка «освоено» цель сюда не переносит — она остаётся в списке с ярлыком.</p>';
    }

    const byProto = new Map();
    items.forEach((g) => {
      if (!byProto.has(g.protocol)) byProto.set(g.protocol, []);
      byProto.get(g.protocol).push(g);
    });

    return [...byProto.entries()].map(([title, list]) => {
      // Решение по целому протоколу: тогда и возвращают его целиком.
      const решение = c.protocolDecisions.get(title);
      return `<div class="proto-block">
        <div class="proto-head">
          <span class="title"><b>${escapeHtml(title)}</b></span>
          <span class="proto-meta">
            <span class="proto-count">${list.length} ${plural(list.length, "цель", "цели", "целей")}</span>
            ${решение ? `<span class="flag">протокол в архиве${решение.at ? " · " + humanDate(решение.at) : ""}</span>
               <span class="acts"><button class="act back" type="button" data-protocol="${escapeHtml(title)}" data-status="active">Вернуть протокол в работу</button></span>` : ""}
          </span>
        </div>
        <div class="proto-body">
          <div class="scroll"><table>
            <thead><tr><th>Цель</th><th class="num">Последний</th><th>Решение</th><th>Кто и когда</th><th></th></tr></thead>
            <tbody>${list.map((g) => {
              const id = c.goals.indexOf(g);
              const d = g.decision || {};
              const своё = c.goalDecisions.has(g.protocol + " ‖ " + g.goal);
              return `<tr class="goal-line row-archived" data-goal="${id}">
                <td><span class="caret">▸</span> ${escapeHtml(g.goal)}</td>
                <td class="num"><span class="${pctClass(g.last)}">${g.last == null ? "—" : g.last + "%"}</span></td>
                <td><span class="flag">в архиве</span></td>
                <td class="decided">${d.by ? escapeHtml(d.by) : "—"}${d.at ? ", " + humanDate(d.at) : ""}</td>
                <td>${своё
                  ? `<span class="acts"><button class="act back" type="button" data-protocol="${escapeHtml(g.protocol)}" data-goal="${escapeHtml(g.goal)}" data-status="active">Вернуть в работу</button></span>`
                  : '<span class="decided">решение по протоколу</span>'}</td>
              </tr>
              ${goalDetail(g, id, 5)}`;
            }).join("")}</tbody>
          </table></div>
        </div>
      </div>`;
    }).join("");
  }

  // ── Занятия ─────────────────────────────────────────────────────────
  // Одна строка — один день, разворачивается в список целей с процентами.
  // Это и есть ответ на вопрос «а история сохраняется?».
  function sessionRows(c) {
    const byDate = new Map();
    c.goals.forEach((g) => g.points.forEach((p) => {
      if (!byDate.has(p.date)) byDate.set(p.date, []);
      byDate.get(p.date).push({ goal: g.goal, protocol: g.protocol, percent: p.percent, responses: p.responses, staff: p.staff });
    }));
    const dates = [...byDate.keys()].sort().reverse();
    if (!dates.length) return '<tr><td colspan="5">Занятий пока нет</td></tr>';

    return dates.map((d) => {
      const items = byDate.get(d);
      const avg = Math.round(items.reduce((a, b) => a + b.percent, 0) / items.length);
      const presses = items.reduce((n, it) => n + String(it.responses || "").trim().split(/\s+/).filter(Boolean).length, 0);
      const staff = [...new Set(items.map((it) => it.staff).filter(Boolean))].join(", ");
      return `<tr class="sess-line" data-date="${d}">
        <td><span class="caret">▸</span> ${humanDate(d)}</td>
        <td>${staff ? escapeHtml(staff) : '<span class="muted">—</span>'}</td>
        <td class="num">${items.length}</td>
        <td class="num"><span class="${pctClass(avg)}">${avg}%</span></td>
        <td class="muted">${presses} ${plural(presses, "проба", "пробы", "проб")}</td>
      </tr>
      <tr class="sess-detail detail" data-date="${d}" hidden><td colspan="5">
        <h4>Что записано ${humanDate(d)}</h4>
        <div class="scroll"><table>
          <thead><tr><th>Цель</th><th class="num">Процент</th><th>Как отвечал</th></tr></thead>
          <tbody>${items.map((it) => `<tr>
            <td>${escapeHtml(it.goal)}<span class="goal-proto">${escapeHtml(it.protocol)}</span></td>
            <td class="num"><span class="${pctClass(it.percent)}">${it.percent}%</span></td>
            <td>${responsesHtml(it.responses)}</td>
          </tr>`).join("")}</tbody>
        </table></div>
      </td></tr>`;
    }).join("");
  }

  function genBlock(c) {
    if (!c.gen.length) {
      return '<p class="muted" style="margin:0">Проб обобщения ещё не было: либо целей с критерием освоения нет, либо их не переводили в обобщение.</p>';
    }
    return `<div class="scroll"><table>
      <thead><tr><th>Цель</th><th>Пройдено</th><th class="num">Из&nbsp;9</th><th>Где получилось</th><th>Не получилось</th><th>Последняя проба</th></tr></thead>
      <tbody>${c.gen.map((g) => {
        const done = g.passed >= 9;
        return `<tr>
          <td>${escapeHtml(g.goal)}<span class="goal-proto">${escapeHtml(g.protocol)}</span></td>
          <td><span class="cells">${Array.from({ length: 9 }, (_, i) => `<span class="cell${i < g.passed ? " on" : ""}"></span>`).join("")}</span></td>
          <td class="num"><b class="${done ? "pct green" : "pct"}">${g.passed}</b></td>
          <td>${g.passedNames && g.passedNames.length ? g.passedNames.map((n) => `<span class="cond">${escapeHtml(n)}</span>`).join(" ") : '<span class="muted">—</span>'}</td>
          <td>${g.failed && g.failed.length ? `<span class="flag warn">${g.failed.map(escapeHtml).join(", ")}</span>` : '<span class="muted">—</span>'}</td>
          <td>${g.last ? humanDate(g.last) : "—"}${done ? ' <span class="flag good">обобщено</span>' : ""}</td>
        </tr>`;
      }).join("")}</tbody>
    </table></div>`;
  }

  function behaviorBlock(c) {
    if (!c.behavior.length) return '<p class="muted" style="margin:0">Подсчётов частоты пока не было.</p>';
    const quiet = c.behavior.filter((b) => !b.count).length;
    const rows = c.behavior.slice().sort((a, b) => b.date.localeCompare(a.date));
    return `
      <div class="switch-modes">
        <button class="btn on" type="button" data-mode="rate">Раз в час</button>
        <button class="btn" type="button" data-mode="count">Сколько раз</button>
      </div>
      <div id="behChart"></div>
      <div id="behLegend" class="legend"></div>
      <p class="muted" style="margin:10px 0 14px;font-size:13px">«Раз в час» сравнивает наблюдения разной длины честно: 4 крика за 10 минут и за 3 часа — разные картины. Наблюдения без таймера в эту шкалу не попадают.</p>
      <div class="scroll"><table>
        <thead><tr><th>Когда</th><th>Поведение</th><th class="num">Раз</th><th class="num">За минут</th><th class="num">В час</th></tr></thead>
        <tbody>${rows.slice(0, 24).map((b) => `<tr>
          <td>${humanDate(b.date)}</td><td>${escapeHtml(b.behavior)}</td>
          <td class="num">${b.count}</td><td class="num">${b.minutes || "—"}</td>
          <td class="num">${b.minutes ? round1((b.count / b.minutes) * 60) : "—"}</td>
        </tr>`).join("")}</tbody>
      </table></div>
      ${quiet ? `<p class="muted" style="margin:10px 0 0;font-size:13px">Строки с нулём — это не пропуск: терапист отметил, что поведение не проявлялось. Таких записей ${quiet}.</p>` : ""}
      <p class="muted" style="margin:8px 0 0;font-size:13px">Эпизодов ABC записано: <b>${c.abc.length}</b> — <a href="#abc">читать</a></p>`;
  }

  function drawBehavior(c, mode, off) {
    const box = view.querySelector("#behChart");
    const legend = view.querySelector("#behLegend");
    if (!box) return;

    let all = behaviorSeries(c.behavior, mode);
    let note = "";
    // Частый случай: наблюдения вели без таймера. Тогда шкала «раз в час»
    // пуста не по ошибке, а потому что делить не на что.
    if (mode === "rate" && !all.length) {
      all = behaviorSeries(c.behavior, "count");
      if (all.length) {
        note = '<p class="muted" style="margin:0 0 8px;font-size:13px">Ни в одном наблюдении не запускали таймер, поэтому «раз в час» посчитать не из чего — показываю количество.</p>';
        mode = "count";
      }
    }

    const shown = all.filter((s) => !off.has(s.name));
    box.innerHTML = note + (all.length
      ? (shown.length
        ? multiChart(shown, { unit: mode === "rate" ? "раз в час" : "раз за наблюдение" })
        : '<p class="muted" style="margin:0">Все линии скрыты — верните хотя бы одну.</p>')
      : '<p class="muted" style="margin:0">Ни одно поведение пока не проявлялось — рисовать нечего.</p>');
    legend.innerHTML = all.map((s) => `<button class="leg${off.has(s.name) ? " off" : ""}" type="button" data-beh="${escapeHtml(s.name)}">
      <span class="leg-dot" style="background:${s.color}"></span>${escapeHtml(s.name)}</button>`).join("");
    legend.querySelectorAll(".leg").forEach((b) => {
      b.addEventListener("click", () => {
        const name = b.dataset.beh;
        if (off.has(name)) off.delete(name); else off.add(name);
        drawBehavior(c, mode, off);
      });
    });
  }

  function abcHtml(c) {
    if (!c.abc.length) return '<p class="muted" style="margin:0">Эпизодов пока не записывали.</p>';
    return c.abc.map((a) => `<div class="abc-item">
      <div class="abc-when">
        <b>${humanDate(a.date)}${a.time ? ", " + escapeHtml(a.time) : ""}</b>
        ${a.intensity ? `<span class="flag">интенсивность: ${escapeHtml(a.intensity)}</span>` : ""}
        ${a.duration ? `<span class="flag">длилось: ${escapeHtml(a.duration)}</span>` : ""}
      </div>
      <div class="abc-grid">
        <div class="abc-part"><span>До эпизода</span>${escapeHtml(a.antecedent) || "—"}</div>
        <div class="abc-part b"><span>Что произошло</span>${escapeHtml(a.behavior) || "—"}</div>
        <div class="abc-part"><span>После</span>${escapeHtml(a.consequence) || "—"}</div>
      </div>
    </div>`).join("");
  }

  // ── Общие сведения ──────────────────────────────────────────────────
  // Правило одно: говорим ФАКТ, найденный в данных, и не назначаем
  // вмешательство — что делать с целью, решает супервизор, а не арифметика.
  // Считаем по целям В РАБОТЕ: разобранное больше не просит внимания.
  const ABC_MIN_EPISODES = 3;

  const есть = (g, ключ) => (g.проблемы || []).some((п) => п.ключ === ключ);

  function adviceHtml(c) {
    const out = [];
    const goals = c.active;

    if (c.silentDays != null && c.silentDays >= SILENT_DAYS) {
      out.push(`Занятий нет ${c.silentDays} ${plural(c.silentDays, "день", "дня", "дней")} — спросить тераписта, идут ли занятия.`);
    }

    if (c.lastDate) {
      const lastDay = goals.map((g) => g.points.find((p) => p.date === c.lastDate)).filter(Boolean);
      const few = lastDay.filter((p) => trialsOf(p) <= FEW_TRIALS).length;
      if (lastDay.length >= 3 && few >= lastDay.length / 2) {
        out.push(`На последнем занятии по ${few} ${plural(few, "цели", "целям", "целям")} из ${lastDay.length} была одна-две пробы: процент по ним показывает только «получилось или нет».`);
      }
    }

    // Те же признаки, что в шапках протоколов и в фильтре (cabinet.js).
    const low = goals.filter((g) => есть(g, "низкие"));
    if (low.length === 1) out.push(`«${low[0].goal}»: ${LOW_IN_A_ROW} замера подряд не выше ${LOW_PERCENT}%.`);
    else if (low.length > 1) out.push(`У ${low.length} ${plural(low.length, "цели", "целей", "целей")} по ${LOW_IN_A_ROW} замера подряд не выше ${LOW_PERCENT}%: ${namesOf(low)}.`);

    {
      const rare = goals.filter((g) => есть(g, "редко"));
      if (rare.length) out.push(`За ${c.days} ${plural(c.days, "занятие", "занятия", "занятий")} по ${rare.length} ${plural(rare.length, "цели данные собраны", "целям данные собраны", "целям данные собраны")} лишь один раз: ${namesOf(rare)}.`);
    }

    if (c.abc.length >= ABC_MIN_EPISODES) {
      const counts = new Map();
      c.abc.forEach((a) => {
        const key = (a.antecedent || "").trim();
        if (key) counts.set(key, (counts.get(key) || 0) + 1);
      });
      const top = [...counts.entries()].sort((a, b) => b[1] - a[1])[0];
      if (top && top[1] >= 2 && top[1] >= c.abc.length / 2) {
        out.push(`В ${top[1]} ${plural(top[1], "эпизоде", "эпизодах", "эпизодах")} из ${c.abc.length} поведение начиналось одинаково: «${top[0]}».`);
      }
    }

    const stuck = goals.filter((g) => есть(g, "плато"));
    if (stuck.length === 1) out.push(`«${stuck[0].goal}» держится около ${stuck[0].last}% и не двигается.`);
    else if (stuck.length > 1) out.push(`${stuck.length} ${plural(stuck.length, "цель держится", "цели держатся", "целей держатся")} на месте: ${namesOf(stuck)}.`);

    const withProbes = new Set(c.gen.map((g) => g.goal));
    const mastered = goals.filter((g) => g.status === "mastered");
    const noProbes = mastered.filter((g) => !withProbes.has(g.goal)).length;
    const probeTail = noProbes ? ` Проб обобщения нет по ${noProbes} из ${mastered.length}.` : "";
    if (mastered.length === 1) out.push(`«${mastered[0].goal}» отвечает критерию освоения — пора на генерализацию и на новую цель.${probeTail}`);
    else if (mastered.length > 1) out.push(`${mastered.length} ${plural(mastered.length, "цель отвечает", "цели отвечают", "целей отвечают")} критерию освоения: ${namesOf(mastered)}.${probeTail}`);

    if (!out.length) out.push("Ничего срочного: цели двигаются, данные приходят.");
    // Список из семи пунктов читают как стену. Первые три видно сразу —
    // они и есть самое важное, порядок здесь не случайный, — остальное
    // открывается по желанию.
    const пункт = (s) => "<li>" + escapeHtml(s) + "</li>";
    const видно = out.slice(0, 3).map(пункт).join("");
    const прочее = out.slice(3);
    const свёрнуто = прочее.length
      ? `<details class="fold"><summary>ещё ${прочее.length} ${plural(прочее.length, "наблюдение", "наблюдения", "наблюдений")}</summary><ul>${прочее.map(пункт).join("")}</ul></details>`
      : "";
    return "<ul>" + видно + "</ul>" + свёрнуто + summaryLine(c, state.now);
  }

  function namesOf(goals, max) {
    max = max || 3;
    const names = goals.slice(0, max).map((g) => `«${g.goal}»`).join(", ");
    return names + (goals.length > max ? ` и ещё ${goals.length - max}` : "");
  }
})();
</script>
</body>
</html>
